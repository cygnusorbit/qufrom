version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: quform_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quform_wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: quform_wp
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: quform_wordpress
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
    volumes:
      # Mounts the WordPress site files so you can access them if needed
      - wp_data:/var/wordpress
      # Crucial: Mounts your local plugin folder directly into the container's plugins directory
      - ./:/var/www/html/wp-content/plugins/quform

volumes:
  db_data:
  wp_data: